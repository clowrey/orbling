name: Simulator

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "components/**"
      - "sim/**"
      - ".github/workflows/sim.yml"

permissions:
  contents: read

jobs:
  sim:
    name: Build and run the simulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run (rules, game bots and fuzz test under the sanitizers)
        run: sh sim/run.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sim-out
          path: sim/out/*.png
          retention-days: 7
