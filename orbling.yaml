text_sensor:
  - platform: template
    name: Pet name
    update_interval: 60s
    lambda: return std::string(id(pet).pet().name());
  - platform: template
    name: Species
    update_interval: 60s
    lambda: return std::string(id(pet).pet().species());
  - platform: template
    name: Stage
    update_interval: 60s
    lambda: return std::string(id(pet).pet().stage_name());
  - platform: template
    name: Mood
    update_interval: 30s
    lambda: return std::string(id(pet).pet().mood());
  - platform: template
    name: Parent
    update_interval: 60s
    lambda: |-
      const char *p = id(pet).pet().parent_name();
      return std::string(p[0] ? p : "none");

binary_sensor:
  - platform: template
    name: Needs attention
    lambda: return id(pet).pet().needs_attention();
  - platform: template
    name: Sick
    lambda: return id(pet).pet().is_sick();
  - platform: template
    name: Asleep
    lambda: return id(pet).pet().is_asleep();
  - platform: template
    name: Tantrum
    lambda: return id(pet).pet().in_tantrum();

button:
  - platform: template
    name: Feed meal
    on_press:
      - lambda: id(pet).pet().feed_meal();
  - platform: template
    name: Feed snack
    on_press:
      - lambda: id(pet).pet().feed_snack();
  - platform: template
    name: Clean up
    on_press:
      - lambda: id(pet).pet().clean_up();
  - platform: template
    name: Give medicine
    on_press:
      - lambda: id(pet).pet().heal();
  - platform: template
    name: Toggle light
    on_press:
      - lambda: id(pet).pet().toggle_light();
  - platform: template
    name: Scold
    on_press:
      - lambda: id(pet).pet().scold();
  - platform: template
    name: Hatch new egg
    entity_category: config
    on_press:
      - lambda: id(pet).hatch_new_egg();

# The pet dims the backlight when its lights are off; a touch brightens it for 20 s.
interval:
  # Chant: listen while the game wants to (its mic is on, someone is there), using Home Assistant's
  # speech-to-text. The microphone is only on during the game.
  - interval: 250ms
    then:
      - lambda: |-
          static uint32_t last_start = 0;
          auto &p = id(pet).pet();
          p.set_voice_link(api::global_api_server != nullptr && api::global_api_server->is_connected());
          bool want = p.wants_listening();
          bool running = id(va).is_running();
          if (want && !running && millis() - last_start > 3000) {
            id(va).request_start(true, true);  // keep listening; each pause ends a phrase
            last_start = millis();
          } else if (!want && running) {
            id(va).request_stop();
          }
          p.set_listening(running);
  # Play the pet's tunes.
  - interval: 100ms
    then:
      - lambda: |-
          const char *tune = id(pet).pet().take_sound();
          if (tune != nullptr) id(beeper).play(tune);  // the engine already checks the Sound setting
  - interval: 1s
    then:
      - lambda: |-
          static float last = -1;
          float b = id(pet).backlight();
          if (fabsf(b - last) > 0.01f) {
            last = b;
            auto call = id(back_light).turn_on();
            call.set_brightness(b);
            call.set_transition_length(500);
            call.perform();
          }

output:
  - platform: ledc
    pin: GPIO15
    id: backlight

light:
  - platform: monochromatic
    id: back_light
    output: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

switch:
  # PCM5100A soft-mute pin (XSMT): high lets sound out.
  - platform: gpio
    pin: GPIO48
    id: dac_xsmt
    name: Audio output
    restore_mode: ALWAYS_ON
  # The pet's beeps; the same setting as on the settings page (saved with the pet).
  - platform: template
    id: sound_on
    name: Sound
    lambda: return id(pet).pet().sound_enabled();
    turn_on_action:
      - lambda: id(pet).pet().set_sound_enabled(true);
    turn_off_action:
      - lambda: id(pet).pet().set_sound_enabled(false);
  # Chant's microphone: the same setting as the mic button in the game (saved with the pet).
  - platform: template
    id: chant_voice
    name: Chant voice
    icon: mdi:microphone
    lambda: return id(pet).pet().voice_enabled();
    turn_on_action:
      - lambda: id(pet).pet().set_voice_enabled(true);
    turn_off_action:
      - lambda: id(pet).pet().set_voice_enabled(false);

# ---- Sound: PCM5100A DAC to the 3.5 mm jack (no built-in speaker; plug in headphones or a powered speaker) ----
i2s_audio:
  - id: i2s_dac
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO18
    i2s_mclk_pin: GPIO21
  # The microphone has its own bus.
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO42

speaker:
  - platform: i2s_audio
    id: dac_speaker
    i2s_audio_id: i2s_dac
    dac_type: external
    i2s_dout_pin: GPIO17
    channel: stereo

rtttl:
  id: beeper
  speaker: dac_speaker
  gain: 60%

# ---- Microphone, for saying the times tables in Chant ----
# The board's I2S microphone sends on the left channel. (Some JC3636W518 boards have a PDM microphone
# instead: if Chant never hears anything, try pdm: true.)
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO46
    adc_type: external
    pdm: false
    channel: left

# Speech-to-text through Home Assistant's Assist pipeline (the one chosen for this device in Home Assistant).
# Only the text matters: there is no speaker for replies.
voice_assistant:
  id: va
  microphone:
    microphone: mic
    gain_factor: 8
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_stt_end:
    - lambda: id(pet).pet().voice_heard(x.c_str());
  on_error:
    - lambda: |-
        ESP_LOGW("chant", "voice error %s: %s", code.c_str(), message.c_str());
        id(pet).pet().voice_error(code.c_str());

spi:
  id: display_qspi
  type: quad
  clk_pin: 9
  data_pins: [11, 12, 13, 14]

i2c:
  sda: 7
  scl: 8
  id: touchscreen_bus

display:
  - platform: qspi_dbi
    model: CUSTOM
    data_rate: 40MHz
    id: main_display
    spi_id: display_qspi
    color_order: rgb
    invert_colors: true
    dimensions:
      height: 362
      width: 360
      offset_height: 0  # 2 leaves a gap at the top (with rotation 0)
    cs_pin: 10
    reset_pin: GPIO47
    rotation: 0
    update_interval: never     # orbling pushes frames itself
