# Orbling: a virtual pet for the Guition JC3636W518 (ESP32-S3, 1.8" round 360x360 ST77916 QSPI, CST816 touch).
# This is the config a device adopted in the ESPHome Device Builder pulls in as a package; the web installer
# firmware is built from orbling.factory.yaml, which adds Wi-Fi setup over USB and firmware updates.
substitutions:
  name: orbling
  friendly_name: Orbling
  # Where the orbling component comes from. orbling.factory.yaml points this at the local checkout.
  orbling_source: github://clowrey/orbling@main
  # Only used without Home Assistant: with it, the clock and time zone come from Home Assistant.
  timezone: UTC

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # One firmware for every board: each gets its own name, e.g. orbling-a1b2c3.
  name_add_mac_suffix: true
  min_version: 2026.7.0
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    then:
      - light.turn_on:
          id: back_light
          brightness: 80%

external_components:
  - source: ${orbling_source}
    components: [orbling]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

# Home Assistant. Adopting the device in the ESPHome Device Builder adds an encryption key.
api:

ota:
  - platform: esphome

wifi:
  # Until it has Wi-Fi details it opens its own access point; join it to pick a network.
  ap:

captive_portal:

time:
  # With Home Assistant: its clock and time zone, nothing to set.
  - platform: homeassistant
    id: ha_time
  # Without it: internet time in the `timezone` substitution.
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

# The pet draws whole frames itself; the display has no lambda and no LVGL.
orbling:
  id: pet
  display_id: main_display
  touchscreen_id: my_touchscreen
  time_id: ha_time
  fallback_time_id: sntp_time

